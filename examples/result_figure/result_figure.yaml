name: figure_creation
outpath: bench_run
comment: A figrue creation example

#Configuration
parameterset:
  name: param_set
  parameter:
    - { name: i,               _: '0,1,2' }
    - { name: x, mode: python, _: '[0,1,2][$i]' }    
    - { name: x2, mode: python, _: '[10,11,12][$i]' }
    - { name: y, mode: python, _: '[1,2,4][$i]' }
    - { name: y2, mode: python, _: '[5,5,5][$i]' }
    - { name: y3, mode: python, _: '[12,10,8][$i]' }

#Regex pattern
patternset:
- name: pattern_all
  pattern:
    - {name: x_pat, type: int, _: "x: $jube_pat_int"} 
    - {name: x2_pat, type: int, _: "x2: $jube_pat_int"} 
    - {name: y_pat, type: int, _: "y: $jube_pat_int"}
    - {name: y2_pat, type: int, _: "y2: $jube_pat_int"}  
    - {name: y3_pat, type: int, _: "y3: $jube_pat_int"}

#Operation
step:
  name: write_coord
  use: param_set #use existing parameterset
  do: 'echo "x: $x; x2: $x2; y: $y; y2: $y2; y3: $y3"'

#Analyse
analyser:
- name: analyse
  analyse:
    step: write_coord
    file:
    - { use: pattern_all, _: stdout}


#Create result figure
result:
  use: analyse #use existing analyser
  figure:
    - name: 1_fig
      title: FIG Title
      savefig: first_fig.png
      showfig: True
      plot:
        - xlabel: My x label
          ylabel: My y label
          legend: True
          data:
            - {x: x_pat, y: y_pat, label: NO LINE, xscale: symlog, yscale: log}
            - {x: x_pat, y: y2_pat, label: NO LINE2}
        - legend: True
          data:
            - {x: x2_pat, y: y2_pat, label: SCATTER, type: scatter}
        - data:
            - {x: x2_pat, y: y3_pat, label: STEP, type: step}
        - data:
            - {x: x2_pat, y: y_pat, label: BAR, type: bar}
    - name: 2_fig
      plot:
        - data:
            - {x: x_pat, y: y3_pat, label: SCATTER, type: scatter}
