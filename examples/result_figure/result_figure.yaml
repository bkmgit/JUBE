name: figure_creation
outpath: bench_run
comment: A figure creation example

#Configuration
parameterset:
- name: param_set
  parameter:
    - { name: i, _: '0,1,2,3' }
    - { name: x2, mode: python, _: '[0,2,4,6][$i]' }
    - { name: y2, mode: python, _: '[10,11,8,9][$i]' }
- name: groupby_params
  parameter:
    - { name: type, _: 'Typ1,Typ2,Typ3' }
    - { name: x, _: '0,1,2,3' }
    - { name: y, mode: python, _: '{
          "Typ1" : [11,12,11,13][$x],
          "Typ2" : [19,18,19,22][$x],
          "Typ3" : [40,20,35,25][$x],
        }.get("${type}",0)' }

#Regex pattern
patternset:
- name: pattern_all
  pattern:
    - {name: type_pat, _: 'type: ${jube_pat_wrd}${jube_pat_bl}'}
    - {name: x_pat, type: int, _: 'x: $jube_pat_int'} 
    - {name: x2_pat, type: int, _: 'x2: $jube_pat_int'} 
    - {name: y_pat, type: int, _: 'y: $jube_pat_int'}
    - {name: y2_pat, type: int, _: 'y2: $jube_pat_int'}  

#Operation
step:
- name: write_numbers
  use: param_set #use existing parameterset
  do: 'echo "x2: $x2; y2: $y2"'
- name: write_groupby
  use: groupby_params #use existing parameterset
  do: 'echo "type: ${type} ; x: $x; y: $y"'

#Analyse
analyser:
  name: analyse
  analyse:
    - step: write_numbers
      file:
        - { use: pattern_all, _: stdout}
    - step: write_groupby
      file:
        - { use: pattern_all, _: stdout}


#Create result figure
result:
  use: analyse #use existing analyser
  figure:
    - name: fig
      title: Title
      nrows: 2
      ncols: 3
      plot:
        - legend: True
          data:
            - {x: x2_pat, y: y2_pat, label: LINE, color: green, marker: ^, linestyle: dashed}
        - data:
            - {x: x2_pat, y: y2_pat, type: stem}
        - data:
            - {x: x2_pat, y: y2_pat, type: scatter}
        - data:
            - {x: x2_pat, y: y2_pat, type: step}
        - data:
            - {x: x2_pat, y: y2_pat, type: bar}
    - name: groupby_fig
      savefig: group_fig.png
      showfig: False
      plot:
        - xlabel: x
          ylabel: y
          legend: True
          data:
            - {x: x_pat, y: y_pat, groupby: type_pat}
