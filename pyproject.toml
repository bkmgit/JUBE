[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "jube"
version = "2.7.1"
description = "JUBE Benchmarking Environment"
readme = "README.md"
license = "GPL-3.0-only"
authors = [
  { name = "Forschungszentrum Juelich GmbH", email = "jube.jsc@fz-juelich.de" },
]
dependencies = [
  "pyyaml",
]
keywords = ['JUBE Benchmarking Environment']
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3.2",
    "Topic :: System :: Monitoring",
    "Topic :: System :: Benchmark",
    "Topic :: Software Development :: Testing"
]

[tool.hatch.envs.test]
dependencies = [
"pytest",
"pytest-cov"
]

[project.scripts]
jube = "jube.main:main"

[project.urls]
Download = "https://www.fz-juelich.de/ias/jsc/jube"
Homepage = "https://www.fz-juelich.de/ias/jsc/jube"

